name: A36 Radar

on:
  workflow_dispatch:
    inputs:
      force_post:
        description: "Ignore the hourly cooldown and post the best unseen story"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Build a post without publishing it"
        required: false
        default: false
        type: boolean

  schedule:
    # Check every 15 minutes, away from the busiest top-of-hour period.
    # Normal news is limited in radar.py to one post per ~hour.
    # A genuinely urgent story can be published between hourly posts.
    - cron: "7,22,37,52 * * * *"
      timezone: "UTC"

concurrency:
  group: a36-radar-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-news:
    name: Publish A36 Radar
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile radar.py

      - name: Run A36 Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DISCUSSION_CHAT_ID: ${{ vars.TELEGRAM_DISCUSSION_CHAT_ID }}
          RSS_USER_AGENT: ${{ vars.RSS_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_post || false }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python radar.py

      - name: Save article history
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "A36 Radar"
          git config user.email "actions@users.noreply.github.com"
          git add seen_articles.json

          if git diff --cached --quiet; then
            echo "No article history changes."
            exit 0
          fi

          git commit -m "Update A36 Radar state"

          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "State pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing on latest ${GITHUB_REF_NAME}."
            git fetch origin "${GITHUB_REF_NAME}"

            if ! GIT_EDITOR=true git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              echo "Automatic rebase failed. Aborting to avoid corrupting state."
              git rebase --abort || true
              exit 1
            fi
          done

          echo "Could not push state after four attempts."
          exit 1
