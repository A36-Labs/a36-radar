name: A36 Radar

on:
  workflow_dispatch:

  schedule:
    # Runs every 3 hours at 20 minutes past the hour.
    # GitHub scheduled workflows use UTC by default.
    - cron: "20 */3 * * *"

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run A36 Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py

      - name: Save processed article history
        run: |
          if git diff --quiet seen_articles.json 2>/dev/null && \
             git ls-files --error-unmatch seen_articles.json >/dev/null 2>&1; then
            echo "No article history changes."
            exit 0
          fi

          git config user.name "A36 Radar"
          git config user.email "actions@users.noreply.github.com"
          git add seen_articles.json
          git commit -m "Update A36 Radar article history" || exit 0
          git push
