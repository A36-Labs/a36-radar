name: A36 Radar

on:
  workflow_dispatch:

  schedule:
    # Runs every four hours globally.
    # Minute 23 avoids GitHub's busiest top-of-hour period.
    - cron: "23 */4 * * *"
      timezone: "UTC"

concurrency:
  group: a36-radar
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  publish-news:
    name: Publish A36 Radar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate Python syntax
        run: python -m py_compile radar.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run A36 Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DISCUSSION_CHAT_ID: ${{ vars.TELEGRAM_DISCUSSION_CHAT_ID }}
          RSS_USER_AGENT: ${{ vars.RSS_USER_AGENT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python radar.py

      - name: Save processed article history
        shell: bash
        run: |
          git config user.name "A36 Radar"
          git config user.email "actions@users.noreply.github.com"

          git add seen_articles.json

          if git diff --cached --quiet; then
            echo "No article history changes."
            exit 0
          fi

          git commit -m "Update A36 Radar article history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
