name: A36 Radar

on:
  workflow_dispatch:

  schedule:
    # Two globally balanced publishing windows each day.
    - cron: "30 7,16 * * *"
      timezone: "UTC"

concurrency:
  group: a36-radar
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  publish-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile radar.py

      - name: Run A36 Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Optional repository variables. Empty variables use the defaults in radar.py.
          AI_MODEL: ${{ vars.AI_MODEL }}
          RSS_USER_AGENT: ${{ vars.RSS_USER_AGENT }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          MAX_AI_CANDIDATES: ${{ vars.MAX_AI_CANDIDATES }}
          ARTICLE_MAX_AGE_HOURS: ${{ vars.ARTICLE_MAX_AGE_HOURS }}
        run: python radar.py

      - name: Save processed article history
        shell: bash
        run: |
          git config user.name "A36 Radar"
          git config user.email "actions@users.noreply.github.com"
          git add seen_articles.json

          if git diff --cached --quiet; then
            echo "No article history changes."
            exit 0
          fi

          git commit -m "Update A36 Radar article history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
